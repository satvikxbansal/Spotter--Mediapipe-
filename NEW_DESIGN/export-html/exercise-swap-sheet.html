<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExerciseSwapSheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #C8FF00;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-black/80 backdrop-blur-sm flex flex-col justify-end font-sans">
      <div class="absolute inset-0 z-[-1] opacity-40">
        <div class="min-h-screen bg-background text-foreground flex flex-col pb-32">
          <div class="relative h-[420px] w-full overflow-hidden">
            <img
              alt="Workout theme"
              src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/jboVeCYRrx9/components/LiVHeu9OKzi.png"
              class="w-full h-full object-cover grayscale brightness-50"
            />
            <div
              class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent"
            ></div>
          </div>
          <div class="px-6 flex-1 -mt-10 bg-background rounded-t-2xl relative z-20 pt-10"></div>
        </div>
      </div>
      <div
        class="bg-card border-t-2 border-white rounded-t-[40px] px-6 pt-3 pb-10 shadow-[0_-20px_50px_rgba(0,0,0,0.5)] animate-in slide-in-from-bottom duration-300"
      >
        <div class="flex flex-col items-center gap-6">
          <div class="w-12 h-1.5 bg-muted rounded-full mb-2"></div>
          <div class="w-full flex items-center justify-between mb-2">
            <h2 class="font-heading font-black text-3xl uppercase italic tracking-tighter italic">
              Adjust <span class="text-accent">Movement</span>
            </h2>
          </div>
          <div
            class="w-full bg-background border-2 border-border/10 rounded-3xl p-5 flex flex-col gap-6 shadow-[inset_0_4px_12px_rgba(0,0,0,0.8)]"
          >
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div
                  class="size-12 bg-accent/10 rounded-xl flex items-center justify-center border border-accent/20"
                >
                  <iconify-icon
                    icon="ph:arrows-out-bold"
                    class="text-2xl text-accent"
                  ></iconify-icon>
                </div>
                <div>
                  <p
                    class="font-heading font-black uppercase text-xl leading-none mb-0.5 tracking-tight"
                  >
                    Air Squats
                  </p>
                  <p
                    class="font-mono text-[9px] uppercase tracking-[0.2em] text-muted-foreground italic"
                  >
                    Target Volume
                  </p>
                </div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="flex flex-col gap-2">
                <span
                  class="font-mono text-[10px] uppercase tracking-widest text-muted-foreground ml-1"
                  >Sets</span
                >
                <div
                  class="flex items-center justify-between bg-muted/40 border border-white/5 rounded-2xl p-2"
                >
                  <button
                    class="size-10 rounded-xl bg-black flex items-center justify-center active:scale-95 transition-transform"
                  >
                    <iconify-icon
                      icon="ph:minus-bold"
                      class="text-white text-sm"
                    ></iconify-icon></button
                  ><span class="font-heading font-black text-2xl italic">3</span
                  ><button
                    class="size-10 rounded-xl bg-black border border-accent/30 flex items-center justify-center active:scale-95 transition-transform shadow-[0_0_15px_rgba(200,255,0,0.1)]"
                  >
                    <iconify-icon icon="ph:plus-bold" class="text-accent text-sm"></iconify-icon>
                  </button>
                </div>
              </div>
              <div class="flex flex-col gap-2">
                <span
                  class="font-mono text-[10px] uppercase tracking-widest text-muted-foreground ml-1"
                  >Reps</span
                >
                <div
                  class="flex items-center justify-between bg-muted/40 border border-white/5 rounded-2xl p-2"
                >
                  <button
                    class="size-10 rounded-xl bg-black flex items-center justify-center active:scale-95 transition-transform"
                  >
                    <iconify-icon
                      icon="ph:minus-bold"
                      class="text-white text-sm"
                    ></iconify-icon></button
                  ><span class="font-heading font-black text-2xl italic">12</span
                  ><button
                    class="size-10 rounded-xl bg-black border border-accent/30 flex items-center justify-center active:scale-95 transition-transform shadow-[0_0_15px_rgba(200,255,0,0.1)]"
                  >
                    <iconify-icon icon="ph:plus-bold" class="text-accent text-sm"></iconify-icon>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="w-full space-y-4">
            <div class="flex items-center justify-between px-1">
              <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-muted-foreground">
                Alternative Movements
              </p>
              <div class="flex items-center gap-1 text-accent">
                <iconify-icon icon="ph:sparkle-fill" class="text-xs"></iconify-icon
                ><span class="text-[10px] font-black uppercase tracking-widest"
                  >AI Alternatives</span
                >
              </div>
            </div>
            <div class="grid grid-cols-1 gap-3 max-h-[160px] overflow-y-auto pr-1">
              <button
                class="group flex items-center gap-4 p-3.5 bg-background border-2 border-border/20 rounded-2xl hover:border-accent transition-all text-left"
              >
                <div class="size-10 bg-accent/10 rounded-xl flex items-center justify-center">
                  <iconify-icon icon="ph:trend-up-bold" class="text-lg text-accent"></iconify-icon>
                </div>
                <div class="flex-1">
                  <p
                    class="font-heading font-black uppercase text-base leading-none mb-0.5 tracking-tight"
                  >
                    Goblet Squats
                  </p>
                  <div class="flex items-center gap-2">
                    <span
                      class="bg-primary/20 text-accent text-[8px] font-black px-1.5 py-0.5 rounded uppercase"
                      >Harder</span
                    >
                  </div>
                </div>
                <iconify-icon
                  icon="ph:plus-bold"
                  class="text-xl text-muted-foreground group-hover:text-accent"
                ></iconify-icon></button
              ><button
                class="group flex items-center gap-4 p-3.5 bg-background border-2 border-border/20 rounded-2xl hover:border-accent transition-all text-left"
              >
                <div class="size-10 bg-white/5 rounded-xl flex items-center justify-center">
                  <iconify-icon
                    icon="ph:arrow-down-bold"
                    class="text-lg text-white/40"
                  ></iconify-icon>
                </div>
                <div class="flex-1">
                  <p
                    class="font-heading font-black uppercase text-base leading-none mb-0.5 tracking-tight"
                  >
                    Box Squats
                  </p>
                  <div class="flex items-center gap-2">
                    <span
                      class="bg-muted text-muted-foreground text-[8px] font-black px-1.5 py-0.5 rounded uppercase"
                      >Easier</span
                    >
                  </div>
                </div>
                <iconify-icon
                  icon="ph:plus-bold"
                  class="text-xl text-muted-foreground group-hover:text-accent"
                ></iconify-icon>
              </button>
            </div>
          </div>
          <div class="w-full flex flex-col gap-3">
            <button
              class="w-full bg-accent text-black font-heading font-black uppercase text-xl h-[64px] rounded-2xl flex items-center justify-center gap-3 shadow-[4px_4px_0px_0px_rgba(200,255,0,0.3)] active:translate-y-1 active:shadow-none transition-all"
            >
              Save Changes</button
            ><button class="w-full flex items-center justify-center gap-3 py-2 group">
              <span
                class="font-heading font-black uppercase text-[10px] tracking-[0.2em] text-muted-foreground group-hover:text-accent transition-colors underline decoration-border/20 underline-offset-4 decoration-2"
                >Reset to original plan</span
              >
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
