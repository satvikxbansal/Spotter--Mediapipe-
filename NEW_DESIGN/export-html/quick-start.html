<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickStart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #C8FF00;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground flex flex-col font-sans pb-28">
      <div class="p-6 pt-12">
        <h1
          class="font-heading text-4xl font-black uppercase leading-[0.85] mb-8 tracking-tighter italic"
        >
          Train Now
        </h1>
        <div class="grid grid-cols-1 gap-6">
          <div
            class="group relative bg-card border-2 border-border rounded-[32px] overflow-hidden shadow-[8px_8px_0px_0px_#C8FF00]"
          >
            <div class="p-8">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span
                    class="bg-primary text-black font-black text-[9px] px-2 py-0.5 rounded uppercase tracking-widest"
                    >Recommended</span
                  >
                </div>
                <button class="text-muted-foreground hover:text-primary transition-colors">
                  <iconify-icon icon="ph:arrows-clockwise-bold" class="text-lg"></iconify-icon>
                </button>
              </div>
              <h2 class="font-heading text-3xl font-black uppercase leading-none mb-2">
                Smart Start
              </h2>
              <p class="text-sm text-muted-foreground font-medium mb-8 pr-12 line-clamp-2">
                "7-min core session to keep your 12-day streak alive today."
              </p>
              <div class="flex items-center gap-4">
                <button
                  class="bg-foreground text-background font-heading font-black px-6 py-3 rounded-2xl uppercase text-sm flex items-center gap-2 hover:bg-primary hover:text-black transition-colors"
                >
                  Go Now<iconify-icon icon="ph:play-fill"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="absolute -right-4 -bottom-4 opacity-10">
              <iconify-icon icon="ph:lightning-fill" class="text-[140px]"></iconify-icon>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div
              class="bg-card border-2 border-border rounded-[24px] p-6 flex flex-col justify-between aspect-square group hover:border-primary transition-colors cursor-pointer"
            >
              <div
                class="size-12 rounded-xl bg-muted border-2 border-border flex items-center justify-center group-hover:bg-primary/20 group-hover:border-primary/50 transition-colors"
              >
                <iconify-icon icon="ph:scan-bold" class="text-2xl"></iconify-icon>
              </div>
              <div>
                <h3 class="font-heading font-black uppercase text-lg leading-tight">
                  Form<br />Check
                </h3>
                <p
                  class="text-[10px] text-muted-foreground font-bold uppercase tracking-wider mt-1"
                >
                  EXERCISE-SPECIFIC
                </p>
              </div>
            </div>
            <div
              class="bg-card border-2 border-border rounded-[24px] p-6 flex flex-col justify-between aspect-square group hover:border-primary transition-colors cursor-pointer relative overflow-hidden"
            >
              <div
                class="size-12 rounded-xl bg-muted border-2 border-border flex items-center justify-center group-hover:bg-primary/20 group-hover:border-primary/50 transition-colors"
              >
                <iconify-icon icon="ph:sneaker-move-bold" class="text-2xl"></iconify-icon>
              </div>
              <div class="absolute top-0 right-0">
                <div
                  class="bg-primary text-black font-black text-[8px] px-8 py-1.5 uppercase tracking-[0.1em] origin-center rotate-45 translate-x-8 translate-y-2 shadow-sm"
                >
                  Exclusive
                </div>
              </div>
              <div>
                <h3 class="font-heading font-black uppercase text-lg leading-tight">
                  Running<br />Analysis
                </h3>
                <p
                  class="text-[10px] text-muted-foreground font-bold uppercase tracking-wider mt-1"
                >
                  GAIT &amp; FORM AI
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <nav
        class="fixed bottom-6 left-6 right-6 bg-card/80 backdrop-blur-xl border-2 border-border rounded-full flex justify-between items-center h-20 px-4 z-50 shadow-[0_20px_40px_-12px_rgba(0,0,0,0.5)]"
      >
        <button
          class="flex-1 flex items-center justify-center text-muted-foreground hover:text-foreground transition-all"
        >
          <iconify-icon icon="ph:house-bold" class="text-3xl"></iconify-icon></button
        ><button class="flex-1 flex items-center justify-center">
          <div
            class="size-16 bg-[#C8FF00] rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(200,255,0,0.4)] active:scale-95 transition-all"
          >
            <iconify-icon icon="ph:camera-fill" class="text-black text-4xl"></iconify-icon>
          </div></button
        ><button
          class="flex-1 flex items-center justify-center text-muted-foreground hover:text-foreground transition-all"
        >
          <iconify-icon icon="ph:user-bold" class="text-3xl"></iconify-icon>
        </button>
      </nav>
    </div>
  </body>
</html>
