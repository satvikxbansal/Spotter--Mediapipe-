<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #C8FF00;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-black text-white flex flex-col px-6 pt-12 pb-8 font-sans">
      <div class="flex items-center justify-between mb-10">
        <div class="flex gap-1.5">
          <div class="h-1.5 w-10 bg-accent rounded-full shadow-[0_0_8px_rgba(200,255,0,0.3)]"></div>
          <div class="h-1.5 w-10 bg-accent rounded-full shadow-[0_0_8px_rgba(200,255,0,0.3)]"></div>
          <div class="h-1.5 w-10 bg-accent rounded-full shadow-[0_0_8px_rgba(200,255,0,0.3)]"></div>
          <div class="h-1.5 w-10 bg-white/15 rounded-full"></div>
        </div>
        <span class="font-mono text-[12px] uppercase tracking-widest text-white/60">03 / 04</span>
      </div>
      <div class="mb-12">
        <h1 class="font-heading text-4xl font-black uppercase leading-none tracking-tighter">
          Define your<br /><span class="text-primary italic">Objective</span>
        </h1>
        <p class="mt-3 text-muted-foreground font-medium">Your plan adjusts based on your focus.</p>
      </div>
      <div class="flex-1 flex flex-col gap-10 overflow-y-auto pb-6">
        <div class="flex flex-col gap-4">
          <div class="flex items-center gap-2 px-1">
            <span class="font-mono text-[11px] uppercase tracking-[0.2em] text-white/50"
              >Primary Focus</span
            >
          </div>
          <div class="flex flex-col gap-3">
            <div class="relative group mb-1">
              <div
                class="absolute inset-0 bg-accent rounded-[24px] translate-x-1.5 translate-y-1.5"
              ></div>
              <button
                class="relative w-full bg-black border border-white rounded-[24px] p-6 flex items-center justify-between text-left"
              >
                <div class="flex items-center gap-5">
                  <div
                    class="size-14 rounded-2xl bg-accent/10 border border-accent/30 flex items-center justify-center"
                  >
                    <iconify-icon
                      icon="ph:armchair-bold"
                      class="text-accent text-3xl"
                    ></iconify-icon>
                  </div>
                  <div>
                    <h3
                      class="font-heading font-black text-2xl uppercase italic text-accent leading-none"
                    >
                      Strength
                    </h3>
                    <p class="text-white/50 text-sm font-medium mt-1">Build muscle &amp; power</p>
                  </div>
                </div>
                <iconify-icon
                  icon="ph:check-circle-fill"
                  class="text-accent text-3xl"
                ></iconify-icon>
              </button>
            </div>
            <button
              class="w-full bg-black border border-white rounded-[24px] p-6 flex items-center justify-between text-left transition-all"
            >
              <div class="flex items-center gap-5">
                <div
                  class="size-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center"
                >
                  <iconify-icon
                    icon="ph:lightning-bold"
                    class="text-white/40 text-3xl"
                  ></iconify-icon>
                </div>
                <div>
                  <h3
                    class="font-heading font-black text-2xl uppercase italic text-white/40 leading-none"
                  >
                    Performance
                  </h3>
                  <p class="text-white/30 text-sm font-medium mt-1">Stamina &amp; athleticism</p>
                </div>
              </div></button
            ><button
              class="w-full bg-black border border-white rounded-[24px] p-6 flex items-center justify-between text-left transition-all"
            >
              <div class="flex items-center gap-5">
                <div
                  class="size-14 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center"
                >
                  <iconify-icon icon="ph:leaf-bold" class="text-white/40 text-3xl"></iconify-icon>
                </div>
                <div>
                  <h3
                    class="font-heading font-black text-2xl uppercase italic text-white/40 leading-none"
                  >
                    Longevity
                  </h3>
                  <p class="text-white/30 text-sm font-medium mt-1">Mobility &amp; health</p>
                </div>
              </div>
            </button>
          </div>
        </div>
        <div class="flex flex-col gap-4">
          <div class="flex items-center gap-2 px-1">
            <span class="font-mono text-[11px] uppercase tracking-[0.2em] text-white/50"
              >Equipment Available</span
            >
          </div>
          <div class="flex flex-wrap gap-3">
            <button
              class="px-5 py-3 rounded-xl border border-white font-heading font-black text-xs uppercase italic bg-black text-accent shadow-[4px_4px_0px_#c8ff00]"
            >
              Bodyweight</button
            ><button
              class="px-5 py-3 rounded-xl border border-white font-heading font-black text-xs uppercase italic bg-black text-accent shadow-[4px_4px_0px_#c8ff00]"
            >
              Dumbbells</button
            ><button
              class="px-5 py-3 rounded-xl border border-white font-heading font-black text-xs uppercase italic bg-black text-white/50"
            >
              Kettlebell
            </button>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-4 pt-4">
        <button
          class="w-[56px] h-[56px] rounded-full border border-white flex items-center justify-center active:scale-95 transition-transform"
        >
          <iconify-icon icon="ph:caret-left-bold" class="text-white text-xl"></iconify-icon></button
        ><button
          class="flex-1 h-[56px] bg-accent rounded-full flex items-center justify-center gap-1 shadow-[0_4px_20px_rgba(200,255,0,0.3)] active:scale-[0.98] transition-all"
        >
          <span
            class="font-heading font-black text-[17px] italic text-black uppercase tracking-tight"
            >CONTINUE</span
          ><iconify-icon icon="ph:arrow-right-bold" class="text-black text-xl"></iconify-icon>
        </button>
      </div>
    </div>
  </body>
</html>
