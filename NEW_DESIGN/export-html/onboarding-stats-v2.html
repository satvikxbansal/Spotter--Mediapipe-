<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnboardingStatsV2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #B8E600;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-black text-white flex flex-col px-6 pt-12 pb-8 font-sans">
      <div class="flex items-center justify-between mb-10">
        <div class="flex gap-1.5">
          <div class="h-1.5 w-10 bg-accent rounded-full shadow-[0_0_8px_rgba(200,255,0,0.3)]"></div>
          <div class="h-1.5 w-10 bg-accent rounded-full shadow-[0_0_8px_rgba(200,255,0,0.3)]"></div>
          <div class="h-1.5 w-10 bg-white/15 rounded-full"></div>
          <div class="h-1.5 w-10 bg-white/15 rounded-full"></div>
        </div>
        <span class="font-mono text-[12px] uppercase tracking-widest text-white/60">02 / 04</span>
      </div>
      <div class="mb-10">
        <h1 class="font-heading text-4xl font-black uppercase leading-none tracking-tighter">
          Enter your<br /><span class="text-primary italic">vitals</span>
        </h1>
        <p class="mt-3 text-muted-foreground font-medium">
          Used to personalize your daily coaching.
        </p>
      </div>
      <div class="flex-1 flex flex-col gap-6 overflow-y-auto pb-6">
        <div class="bg-black border border-white rounded-[24px] p-6 flex flex-col gap-6">
          <div class="flex items-center justify-between">
            <span class="font-mono text-[11px] uppercase tracking-[0.2em] text-white/50"
              >Height</span
            >
            <div class="flex bg-black border border-white/20 rounded-full p-1">
              <button
                class="px-4 py-1 rounded-full bg-accent text-black text-[10px] font-black uppercase italic"
              >
                CM</button
              ><button
                class="px-4 py-1 rounded-full text-white/40 text-[10px] font-black uppercase italic"
              >
                FT
              </button>
            </div>
          </div>
          <div class="flex flex-col items-center">
            <div class="relative mb-6">
              <span
                class="font-heading text-7xl font-black text-white italic tracking-tighter leading-none"
                >178</span
              ><span
                class="absolute -right-6 bottom-1 font-mono text-xs uppercase tracking-widest text-accent font-bold"
                >cm</span
              >
            </div>
            <div class="w-full relative h-12 flex items-center justify-center">
              <div class="absolute inset-0 flex items-center justify-between px-4 opacity-40">
                <div class="h-4 w-[1px] bg-white"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-6 w-[2px] bg-white/60"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-4 w-[1px] bg-white"></div>
              </div>
              <div
                class="absolute h-10 w-[3px] bg-accent shadow-[0_0_15px_rgba(200,255,0,0.5)] z-10"
              ></div>
            </div>
          </div>
        </div>
        <div class="bg-black border border-white rounded-[24px] p-6 flex flex-col gap-6">
          <div class="flex items-center justify-between">
            <span class="font-mono text-[11px] uppercase tracking-[0.2em] text-white/50"
              >Weight</span
            >
            <div class="flex bg-black border border-white/20 rounded-full p-1">
              <button
                class="px-4 py-1 rounded-full bg-accent text-black text-[10px] font-black uppercase italic"
              >
                KG</button
              ><button
                class="px-4 py-1 rounded-full text-white/40 text-[10px] font-black uppercase italic"
              >
                LB
              </button>
            </div>
          </div>
          <div class="flex flex-col items-center">
            <div class="relative mb-6">
              <span
                class="font-heading text-7xl font-black text-white italic tracking-tighter leading-none"
                >84.5</span
              ><span
                class="absolute -right-6 bottom-1 font-mono text-xs uppercase tracking-widest text-accent font-bold"
                >kg</span
              >
            </div>
            <div class="w-full relative h-12 flex items-center justify-center">
              <div class="absolute inset-0 flex items-center justify-between px-4 opacity-40">
                <div class="h-4 w-[1px] bg-white"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-6 w-[2px] bg-white/60"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-2 w-[1px] bg-white/40"></div>
                <div class="h-4 w-[1px] bg-white"></div>
              </div>
              <div
                class="absolute h-10 w-[3px] bg-accent shadow-[0_0_15px_rgba(200,255,0,0.5)] z-10"
              ></div>
            </div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-4 pt-4">
        <button
          class="w-[56px] h-[56px] rounded-full border border-white flex items-center justify-center active:scale-95 transition-transform"
        >
          <iconify-icon icon="ph:caret-left-bold" class="text-white text-xl"></iconify-icon></button
        ><button
          class="flex-1 h-[56px] bg-accent rounded-full flex items-center justify-center gap-1 shadow-[0_4px_20px_rgba(200,255,0,0.3)] active:scale-[0.98] transition-all"
        >
          <span
            class="font-heading font-black text-[17px] italic text-black uppercase tracking-tight"
            >CONTINUE</span
          ><iconify-icon icon="ph:arrow-right-bold" class="text-black text-xl"></iconify-icon>
        </button>
      </div>
    </div>
  </body>
</html>
