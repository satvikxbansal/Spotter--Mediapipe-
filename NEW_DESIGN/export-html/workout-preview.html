<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkoutPreview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #B8E600;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground flex flex-col font-sans pb-32">
      <div class="relative h-[420px] w-full overflow-hidden">
        <img
          alt="Workout theme"
          src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/jboVeCYRrx9/components/LiVHeu9OKzi.png"
          class="w-full h-full object-cover"
        />
        <div
          class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent"
        ></div>
        <div
          class="absolute inset-0 bg-gradient-to-b from-background/40 via-transparent to-transparent"
        ></div>
        <button
          onclick="history.back()"
          class="absolute top-12 left-6 size-12 bg-background/40 backdrop-blur-xl border-2 border-border rounded-xl flex items-center justify-center hover:bg-background/60 transition-colors"
        >
          <iconify-icon icon="ph:caret-left-bold" class="text-xl"></iconify-icon>
        </button>
        <div class="absolute bottom-12 px-6 w-full">
          <div class="flex items-center gap-2 mb-4">
            <span
              class="bg-[#C8FF00] text-black font-heading font-black text-[10px] px-3 py-1 rounded-full uppercase tracking-tighter"
              >Day 2: Starter Strength</span
            >
          </div>
          <h1
            class="font-heading text-7xl font-black uppercase leading-[0.8] tracking-tighter drop-shadow-[0_4px_16px_rgba(0,0,0,1)]"
          >
            Full Body<br />Engine
          </h1>
        </div>
      </div>
      <div class="px-6 flex-1 -mt-10 bg-background rounded-t-2xl relative z-20 pt-10">
        <div class="flex items-center justify-between mb-10">
          <div class="flex gap-3">
            <div
              class="flex items-center gap-2 border-2 border-border px-4 py-2.5 rounded-xl bg-card shadow-[3px_3px_0px_0px_rgba(255,255,255,0.05)]"
            >
              <iconify-icon icon="ph:clock-bold" class="text-[#C8FF00]"></iconify-icon
              ><span class="font-heading text-xs font-black uppercase tracking-wider">35 MIN</span>
            </div>
            <div
              class="flex items-center gap-2 border-2 border-border px-4 py-2.5 rounded-xl bg-card shadow-[3px_3px_0px_0px_rgba(255,255,255,0.05)]"
            >
              <iconify-icon icon="ph:lightning-bold" class="text-[#C8FF00]"></iconify-icon
              ><span class="font-heading text-xs font-black uppercase tracking-wider">Hard</span>
            </div>
          </div>
          <div class="text-right">
            <p
              class="font-heading text-[10px] font-black uppercase text-muted-foreground tracking-[0.2em] mb-1"
            >
              Focus
            </p>
            <p class="font-heading text-sm font-black uppercase italic tracking-tight">
              Hypertrophy
            </p>
          </div>
        </div>
        <div class="space-y-6">
          <div class="flex items-center justify-between px-1">
            <h3
              class="font-heading font-black uppercase text-xs tracking-[0.2em] text-muted-foreground"
            >
              Workout Plan (4)
            </h3>
            <button
              class="text-[#C8FF00] font-heading font-black uppercase text-[10px] tracking-widest"
            >
              Swap All
            </button>
          </div>
          <div class="space-y-4">
            <div
              class="group flex items-center justify-between p-5 bg-card border-2 border-border rounded-2xl hover:border-[#C8FF00]/60 transition-all shadow-[4px_4px_0px_0px_rgba(200,255,0,0.1)]"
            >
              <div class="flex items-center gap-4">
                <div
                  class="size-14 bg-background border-2 border-border/20 rounded-xl flex items-center justify-center overflow-hidden"
                >
                  <iconify-icon
                    icon="ph:arrows-out-bold"
                    class="text-2xl text-[#C8FF00]/30"
                  ></iconify-icon>
                </div>
                <div>
                  <p
                    class="font-heading font-black uppercase text-xl leading-none mb-1 tracking-tight"
                  >
                    Air Squats
                  </p>
                  <p
                    class="font-heading text-[10px] font-black text-muted-foreground uppercase tracking-widest"
                  >
                    3 Sets • 12 Reps
                  </p>
                </div>
              </div>
              <button
                class="size-10 flex items-center justify-center text-muted-foreground hover:text-[#C8FF00] transition-colors"
              >
                <iconify-icon icon="ph:pencil-simple-line-bold" class="text-xl"></iconify-icon>
              </button>
            </div>
            <div
              class="group flex items-center justify-between p-5 bg-card border-2 border-border rounded-2xl hover:border-[#C8FF00]/60 transition-all shadow-[4px_4px_0px_0px_rgba(200,255,0,0.1)]"
            >
              <div class="flex items-center gap-4">
                <div
                  class="size-14 bg-background border-2 border-border/20 rounded-xl flex items-center justify-center overflow-hidden"
                >
                  <iconify-icon
                    icon="ph:push-pin-bold"
                    class="text-2xl text-[#C8FF00]/30"
                  ></iconify-icon>
                </div>
                <div>
                  <p
                    class="font-heading font-black uppercase text-xl leading-none mb-1 tracking-tight"
                  >
                    Push Ups
                  </p>
                  <p
                    class="font-heading text-[10px] font-black text-muted-foreground uppercase tracking-widest"
                  >
                    3 Sets • AMRAP
                  </p>
                </div>
              </div>
              <button
                class="size-10 flex items-center justify-center text-muted-foreground hover:text-[#C8FF00] transition-colors"
              >
                <iconify-icon icon="ph:pencil-simple-line-bold" class="text-xl"></iconify-icon>
              </button>
            </div>
            <div
              class="group flex items-center justify-between p-5 bg-card border-2 border-border rounded-2xl hover:border-[#C8FF00]/60 transition-all shadow-[4px_4px_0px_0px_rgba(200,255,0,0.1)]"
            >
              <div class="flex items-center gap-4">
                <div
                  class="size-14 bg-background border-2 border-border/20 rounded-xl flex items-center justify-center overflow-hidden"
                >
                  <iconify-icon
                    icon="ph:trend-up-bold"
                    class="text-2xl text-[#C8FF00]/30"
                  ></iconify-icon>
                </div>
                <div>
                  <p
                    class="font-heading font-black uppercase text-xl leading-none mb-1 tracking-tight"
                  >
                    Lunges
                  </p>
                  <p
                    class="font-heading text-[10px] font-black text-muted-foreground uppercase tracking-widest"
                  >
                    3 Sets • 10 Per Leg
                  </p>
                </div>
              </div>
              <button
                class="size-10 flex items-center justify-center text-muted-foreground hover:text-[#C8FF00] transition-colors"
              >
                <iconify-icon icon="ph:pencil-simple-line-bold" class="text-xl"></iconify-icon>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div
        class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background via-background/95 to-transparent pt-16 z-30"
      >
        <button
          onclick="window.location.hash=&#39;#EBZ9EkYCzh2&#39;"
          class="w-full bg-[#C8FF00] text-black font-heading font-black uppercase text-2xl h-[72px] rounded-2xl flex items-center justify-center gap-4 shadow-[4px_4px_0px_0px_rgba(200,255,0,0.3)] active:translate-y-1 active:shadow-none transition-all"
        >
          Start Session<iconify-icon icon="ph:play-fill" class="text-2xl"></iconify-icon>
        </button>
      </div>
    </div>
  </body>
</html>
