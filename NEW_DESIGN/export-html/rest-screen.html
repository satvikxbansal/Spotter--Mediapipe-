<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestScreen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #C8FF00;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div
      class="min-h-screen bg-background text-foreground flex flex-col font-sans p-6 pb-[env(safe-area-inset-bottom,24px)] overflow-y-auto"
    >
      <div class="flex items-center justify-end pt-4 mb-8">
        <button
          onclick="window.location.hash=&#39;#vC0pQavpqxL&#39;"
          class="font-heading text-[11px] font-black uppercase tracking-widest text-muted-foreground hover:text-foreground transition-colors"
        >
          Skip Rest
        </button>
      </div>
      <div class="flex flex-col items-center mb-12">
        <div class="relative inline-flex items-center justify-center">
          <svg class="size-64 -rotate-90">
            <circle
              r="120"
              cx="128"
              cy="128"
              fill="transparent"
              stroke="currentColor"
              class="text-white/5"
              stroke-width="8"
            />
            <circle
              r="120"
              cx="128"
              cy="128"
              fill="transparent"
              stroke="currentColor"
              class="text-[#C8FF00]"
              stroke-width="8"
              stroke-linecap="round"
              stroke-dasharray="753.98"
              stroke-dashoffset="188.49"
            />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="font-heading text-[110px] font-black leading-none tracking-tighter"
              >44</span
            ><span
              class="font-heading text-[12px] font-black text-muted-foreground uppercase tracking-[0.4em] mt-4"
              >Seconds Left</span
            >
          </div>
        </div>
      </div>
      <div
        class="bg-card border-2 border-border rounded-2xl p-8 mb-auto shadow-[8px_8px_0px_0px_rgba(255,255,255,0.05)]"
      >
        <div class="flex items-start justify-between mb-8">
          <div>
            <p
              class="font-heading text-[10px] font-black uppercase text-muted-foreground tracking-widest mb-1"
            >
              Last Set
            </p>
            <h2 class="font-heading text-3xl font-black uppercase italic tracking-tight">
              Pushups
            </h2>
          </div>
          <div
            class="bg-background border-2 border-border px-4 py-3 rounded-xl text-center min-w-[84px] shadow-[4px_4px_0px_0px_rgba(255,255,255,0.05)]"
          >
            <p class="font-heading text-2xl font-black leading-none mb-1 text-foreground">12</p>
            <p
              class="font-heading text-[10px] font-black uppercase text-muted-foreground tracking-widest"
            >
              Reps
            </p>
          </div>
        </div>
        <div class="space-y-6">
          <div class="flex items-start gap-4">
            <div
              class="size-10 rounded-xl bg-[#00D1FF]/10 border-2 border-[#00D1FF]/30 flex items-center justify-center shrink-0 mt-0.5"
            >
              <iconify-icon icon="ph:check-bold" class="text-[#00D1FF] text-lg"></iconify-icon>
            </div>
            <div class="flex flex-col">
              <p class="font-heading font-black text-[15px] leading-tight uppercase tracking-tight">
                Excellent Depth
              </p>
              <p class="font-sans text-sm text-muted-foreground">Maintained 95% range of motion</p>
            </div>
          </div>
          <div class="flex items-start gap-4">
            <div
              class="size-10 rounded-xl bg-[#00D1FF]/10 border-2 border-[#00D1FF]/30 flex items-center justify-center shrink-0 mt-0.5"
            >
              <iconify-icon icon="ph:info-bold" class="text-[#00D1FF] text-lg"></iconify-icon>
            </div>
            <div class="flex flex-col">
              <p class="font-heading font-black text-[15px] leading-tight uppercase tracking-tight">
                Coach's Note
              </p>
              <p class="font-sans text-sm text-muted-foreground italic opacity-90">
                "Depth improved after rep 4. Keep it up."
              </p>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-10 space-y-4">
        <div class="flex items-end justify-between px-2 mb-2">
          <div class="flex flex-col">
            <p
              class="font-heading text-[10px] font-black text-muted-foreground uppercase tracking-widest mb-1"
            >
              Up Next
            </p>
            <p class="font-heading text-xl font-black uppercase tracking-tight">
              Pushups • Set 2 of 3
            </p>
          </div>
          <button
            class="text-[#C8FF00] font-heading font-black uppercase text-[11px] tracking-widest hover:opacity-80 transition-opacity"
          >
            +15s Rest
          </button>
        </div>
        <button
          onclick="window.location.hash=&#39;#vC0pQavpqxL&#39;"
          class="w-full h-16 bg-[#C8FF00] text-black font-heading font-black uppercase tracking-tight text-xl rounded-2xl flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(200,255,0,0.3)] active:translate-y-1 active:shadow-none transition-all group"
        >
          Start Set 2<iconify-icon
            icon="ph:play-fill"
            class="ml-2 text-lg transition-transform group-hover:scale-110"
          ></iconify-icon>
        </button>
      </div>
    </div>
  </body>
</html>
