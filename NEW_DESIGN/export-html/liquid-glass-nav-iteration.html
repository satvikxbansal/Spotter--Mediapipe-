<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiquidGlassNavIteration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #C8FF00;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-[100dvh] bg-background text-foreground flex flex-col font-sans pb-36">
      <div class="p-6 flex items-center justify-between mt-4">
        <div>
          <h1
            class="font-heading text-4xl font-black uppercase leading-none tracking-tighter italic"
          >
            Hello, Satvik
          </h1>
          <p
            class="text-[10px] font-black uppercase tracking-[0.2em] text-muted-foreground mt-2 flex items-center gap-2"
          >
            <span class="size-1.5 rounded-full bg-primary animate-pulse"></span>Status: Training
            Active
          </p>
        </div>
        <div class="size-14 rounded-2xl border-2 border-border p-1 bg-card">
          <img
            src="https://lh3.googleusercontent.com/a/ACg8ocKW_1w5VXgX8YB8Gz2Ci4yV5Ip7GKJLoC062N2EMKe4eS56G0nK=s96-c"
            class="rounded-xl w-full h-full object-cover"
          />
        </div>
      </div>
      <div class="px-6 space-y-6 flex-1">
        <div
          class="bg-primary/5 border-2 border-primary/20 rounded-[24px] p-4 flex items-center justify-between group cursor-pointer hover:bg-primary/10 transition-colors"
        >
          <div class="flex items-center gap-4">
            <div
              class="size-12 rounded-xl bg-primary/20 flex items-center justify-center border border-primary/30"
            >
              <iconify-icon icon="ph:barbell-fill" class="text-primary text-2xl"></iconify-icon>
            </div>
            <div>
              <p
                class="text-[9px] font-black uppercase tracking-widest text-primary/80 leading-none"
              >
                Next Milestone
              </p>
              <p
                class="font-heading font-bold text-lg uppercase leading-none mt-1 text-primary italic"
              >
                Squat Depth: +2cm
              </p>
            </div>
          </div>
          <iconify-icon
            icon="ph:arrow-right-bold"
            class="text-primary group-hover:translate-x-1 transition-transform"
          ></iconify-icon>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div
            class="border-4 border-border rounded-[32px] p-6 bg-card flex flex-col justify-between aspect-square relative overflow-hidden group hover:border-chart-1 transition-colors"
          >
            <div
              class="size-12 rounded-2xl bg-chart-1/10 flex items-center justify-center border-2 border-chart-1/20"
            >
              <iconify-icon
                icon="ph:shooting-star-fill"
                class="text-3xl text-chart-1"
              ></iconify-icon>
            </div>
            <div>
              <p class="text-5xl font-heading font-black leading-none text-chart-1 italic">
                94<span class="text-xl">%</span>
              </p>
              <p
                class="text-[10px] font-black uppercase text-muted-foreground tracking-widest mt-2"
              >
                Form Score
              </p>
            </div>
            <div class="absolute -right-2 -bottom-2 opacity-10">
              <iconify-icon
                icon="ph:chart-line-up-fill"
                class="text-8xl text-chart-1"
              ></iconify-icon>
            </div>
          </div>
          <div
            class="border-4 border-border rounded-[32px] p-6 bg-card flex flex-col justify-between aspect-square relative overflow-hidden group hover:border-primary transition-all"
          >
            <div
              class="size-12 rounded-2xl bg-primary/10 flex items-center justify-center border-2 border-primary/20"
            >
              <iconify-icon icon="ph:fire-fill" class="text-3xl text-primary"></iconify-icon>
            </div>
            <div>
              <p
                class="text-[10px] font-black uppercase text-muted-foreground tracking-widest mb-1"
              >
                Consistency
              </p>
              <div class="flex items-baseline gap-1">
                <p class="text-5xl font-heading font-black leading-none italic text-primary">14</p>
                <p class="text-[10px] font-black uppercase tracking-widest text-muted-foreground">
                  Days
                </p>
              </div>
            </div>
            <div
              class="absolute -bottom-2 -right-2 opacity-10 group-hover:opacity-20 transition-opacity"
            >
              <iconify-icon
                icon="ph:chart-line-up-fill"
                class="text-8xl text-primary"
              ></iconify-icon>
            </div>
          </div>
        </div>
      </div>
      <div class="fixed bottom-10 left-1/2 -translate-x-1/2 w-[92%] max-w-[440px] z-[100]">
        <nav
          class="h-[92px] bg-black/40 backdrop-blur-3xl border-2 border-white/20 rounded-[46px] flex items-center justify-between px-2 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8),inset_0_1px_2px_rgba(255,255,255,0.2)]"
        >
          <button
            class="flex-1 flex items-center justify-center h-[76px] bg-white/10 rounded-[38px] transition-all duration-300 group"
          >
            <iconify-icon
              icon="ph:squares-four-fill"
              class="text-primary text-4xl group-active:scale-90 transition-transform"
            ></iconify-icon></button
          ><button
            class="flex-1 flex items-center justify-center h-[76px] text-white/40 hover:text-white transition-all duration-300 group"
          >
            <iconify-icon
              icon="ph:camera-fill"
              class="text-4xl group-active:scale-90 transition-transform"
            ></iconify-icon></button
          ><button
            class="flex-1 flex items-center justify-center h-[76px] text-white/40 hover:text-white transition-all duration-300 group"
          >
            <iconify-icon
              icon="ph:trophy-fill"
              class="text-4xl group-active:scale-90 transition-transform"
            ></iconify-icon></button
          ><button
            class="flex-1 flex items-center justify-center h-[76px] text-white/40 hover:text-white transition-all duration-300 group"
          >
            <iconify-icon
              icon="ph:user-circle-fill"
              class="text-4xl group-active:scale-90 transition-transform"
            ></iconify-icon>
          </button>
        </nav>
      </div>
    </div>
  </body>
</html>
