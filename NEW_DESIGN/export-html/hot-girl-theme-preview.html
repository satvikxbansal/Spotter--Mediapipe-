<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HotGirlThemePreview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: round;
        --shape-multiplier: 1;

          --background: #0D0D0D;
        --foreground: #F2F0EB;
        --primary: #C8FF00;
        --primary-foreground: #000000;
        --secondary: #262626;
        --secondary-foreground: #F2F0EB;
        --muted: #262626;
        --muted-foreground: #A3A3A3;
        --accent: #C8FF00;
        --accent-foreground: #000000;
        --destructive: #FF5C3A;
        --card: #0D0D0D;
        --card-foreground: #F2F0EB;
        --popover: #0D0D0D;
        --popover-foreground: #F2F0EB;
        --border: #F2F0EB;
        --input: #0D0D0D;
        --ring: #C8FF00;
        --chart-1: #00D1FF;
        --chart-2: #C8FF00;
        --chart-3: #FF5C3A;
        --chart-4: #525252;
        --chart-5: #262626;

        --font-sans: "DM Sans";
        --font-heading: "Space Grotesk";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 1rem;
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-[100dvh] bg-[#0D0D0D] text-[#F2F0EB] flex flex-col font-sans pb-28">
      <div class="p-5 flex items-center justify-between mt-4">
        <div>
          <p class="text-muted-foreground font-black uppercase text-[10px] tracking-[0.2em]">
            Theme: Hot Girl
          </p>
          <h1 class="font-heading text-3xl font-black uppercase leading-none mt-1 text-[#FF00FF]">
            Aura Check
          </h1>
        </div>
        <div
          class="size-12 rounded-full border-2 border-[#F2F0EB] overflow-hidden shadow-[0_0_15px_rgba(255,0,255,0.2)]"
        >
          <img
            src="https://lh3.googleusercontent.com/a/ACg8ocKW_1w5VXgX8YB8Gz2Ci4yV5Ip7GKJLoC062N2EMKe4eS56G0nK=s96-c"
          />
        </div>
      </div>
      <div class="px-5 space-y-4 flex-1">
        <div
          class="bg-[#FF00FF]/5 border-2 border-[#FF00FF]/20 rounded-2xl p-4 flex items-center justify-between"
        >
          <div class="flex items-center gap-3">
            <div class="size-10 rounded-lg bg-[#FF00FF]/20 flex items-center justify-center">
              <iconify-icon icon="ph:sparkle-fill" class="text-[#FF00FF] text-xl"></iconify-icon>
            </div>
            <div>
              <p
                class="text-[9px] font-black uppercase tracking-widest text-[#FF00FF]/80 leading-none"
              >
                Vibe
              </p>
              <p class="font-heading font-bold text-base uppercase leading-none mt-1">
                Radiant Energy
              </p>
            </div>
          </div>
          <iconify-icon icon="ph:star-fill" class="text-[#00FFFF] text-xl"></iconify-icon>
        </div>
        <div
          class="border-2 border-[#F2F0EB] rounded-2xl bg-[#0D0D0D] overflow-hidden shadow-[4px_4px_0px_0px_#FF00FF]"
        >
          <div class="p-6">
            <h2
              class="font-heading text-4xl font-black uppercase leading-[0.85] mb-6 tracking-tighter text-[#F2F0EB]"
            >
              Glute<br />Sculpt
            </h2>
            <button
              class="w-full bg-[#FF00FF] text-white font-heading font-bold uppercase text-xl h-[64px] rounded-[24px] flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-[0_0_20px_rgba(255,0,255,0.4)]"
            >
              Let's Glow<iconify-icon icon="ph:magic-wand-fill"></iconify-icon>
            </button>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div
            class="border-2 border-[#F2F0EB] rounded-2xl p-5 bg-[#0D0D0D] flex flex-col justify-between aspect-square shadow-[4px_4px_0px_0px_rgba(255,0,255,0.15)]"
          >
            <div
              class="size-10 rounded-xl border-2 border-[#FF00FF] flex items-center justify-center"
            >
              <iconify-icon icon="ph:heart-fill" class="text-[#FF00FF] text-2xl"></iconify-icon>
            </div>
            <div>
              <p class="text-4xl font-heading font-black leading-none text-[#FF00FF]">850</p>
              <p class="text-[9px] font-black uppercase text-muted-foreground tracking-widest mt-2">
                Cals Burned
              </p>
            </div>
          </div>
          <div
            class="border-2 border-[#F2F0EB] rounded-2xl p-5 bg-[#0D0D0D] flex flex-col justify-between aspect-square shadow-[4px_4px_0px_0px_rgba(0,255,255,0.15)]"
          >
            <div
              class="size-10 rounded-xl border-2 border-[#00FFFF] flex items-center justify-center"
            >
              <iconify-icon icon="ph:waves-bold" class="text-[#00FFFF] text-2xl"></iconify-icon>
            </div>
            <div>
              <p class="text-4xl font-heading font-black leading-none text-[#00FFFF]">100%</p>
              <p class="text-[9px] font-black uppercase text-muted-foreground tracking-widest mt-2">
                Flow state
              </p>
            </div>
          </div>
        </div>
        <div
          class="border-2 border-[#F2F0EB] rounded-2xl p-5 bg-[#0D0D0D] relative overflow-hidden"
        >
          <div class="flex items-center gap-2 mb-3">
            <iconify-icon icon="ph:crown-simple-fill" class="text-[#00FFFF]"></iconify-icon>
            <h3 class="font-heading font-bold uppercase text-[10px] tracking-widest text-[#00FFFF]">
              Queen's Insight
            </h3>
          </div>
          <p class="font-heading font-bold text-xl uppercase leading-[1.1] italic text-[#F2F0EB]">
            "Your posture is iconic today. Keep that chin up during the holds."
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
